default:
  tags:
    - devops

build-job:
  stage: build
  script:
    - mvn compile

test-job:
  stage: test
  script:
    - mvn test

deploy-staging:
  stage: deploy
  before_script:
    - sh .gitlab/ci/cleanup.sh
  script:
    - export PORT=5000
    - sh target/bin/simplewebapp &> /dev/null &
    - echo $! > simplewebapp.pid

deploy-prod:
  stage: deploy
  script:
    - mvn package
    - dpl --provider=heroku --app=ef420-simplewebapp --api-key=14eb8559-b004-4ebd-9059-f7e09305b68a
