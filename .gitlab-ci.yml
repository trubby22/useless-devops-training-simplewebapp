default:
  tags:
    - devops

build-job:
  stage: build
  script:
    - mvn compile

test-job:
  stage: test
  script:
    - mvn test

deploy-staging:
  stage: deploy
  before_script:
    - sh .gitlab/ci/cleanup.sh
  script:
    - export PORT=5000
    - mvn package
    - sh target/bin/simplewebapp &> /dev/null &
    - echo $! > simplewebapp.pid

